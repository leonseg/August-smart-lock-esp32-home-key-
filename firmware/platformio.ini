; PlatformIO configuration for August HomeKey ESP32-C6 firmware.
;
; Two build environments are provided:
;
;   [env:esp32c6]            — Standalone build: our custom firmware only.
;                              Works without Apple HomeKey (UID-based NFC auth,
;                              MQTT + HomeAssistant discovery, WS2812B, LIS3DH,
;                              DRV8833 PWM). This is what main.cpp compiles.
;
;   [env:esp32c6-homekey]    — Overlay build: compile this project on top of
;                              rednblkx/HomeKey-ESP32 for full Apple HomeKey
;                              support. See firmware/HOMEKEY-INTEGRATION.md
;                              for the fork/overlay procedure.
;
; Usage:
;   cd firmware
;   pio run -e esp32c6 --target upload        # standalone
;   pio run -e esp32c6-homekey --target upload  # after HomeKey overlay setup

[platformio]
default_envs = esp32c6
src_dir = src

[env]
platform = espressif32
board = esp32-c6-devkitc-1
framework = arduino
board_build.mcu = esp32c6
monitor_speed = 115200
upload_speed = 460800
board_build.partitions = default.csv

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

lib_deps =
    bblanchon/ArduinoJson@^7.0.0
    knolleary/PubSubClient@^2.8
    adafruit/Adafruit PN532@^1.3.3
    sparkfun/SparkFun LIS3DH Arduino Library@^1.0.3
    fastled/FastLED@^3.7.0

; =============================================================================
; Standalone build
; =============================================================================
[env:esp32c6]

; =============================================================================
; HomeKey overlay build
; =============================================================================
; This env is prepared for when you've cloned rednblkx/HomeKey-ESP32 and applied
; the overlay from HOMEKEY-INTEGRATION.md. It excludes our main.cpp/wifi_mgr/mqtt
; (HomeKey-ESP32 provides its own) and compiles only our hardware modules.
[env:esp32c6-homekey]
build_src_filter =
    +<*>
    -<main.cpp>
    -<wifi_mgr.cpp>
    -<wifi_mgr.h>
    -<mqtt.cpp>
    -<mqtt.h>
lib_deps =
    ${env.lib_deps}
    ; HomeKey-ESP32 adds its own: HomeSpan, mbedTLS extras, etc.
    ; See rednblkx/HomeKey-ESP32 platformio.ini for the authoritative list.
build_flags =
    ${env.build_flags}
    -DHOMEKEY_OVERLAY=1
