; PlatformIO configuration for building HomeKey-ESP32 from source
; targeting the ESP32-C6 Super Mini
;
; Usage:
;   1. Clone https://github.com/rednblkx/HomeKey-ESP32
;   2. Copy this file to the root of the cloned repo
;   3. Run: pio run --target upload
;
; NOTE: This config is only needed if building from source.
; For pre-built binaries, use scripts/flash.sh instead.

[env:esp32c6]
platform = espressif32
board = esp32-c6-devkitc-1
framework = arduino
board_build.mcu = esp32c6

; Serial monitor
monitor_speed = 115200
upload_speed = 460800

; Partition scheme — needs enough space for OTA
board_build.partitions = default.csv

; Build flags
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; SPI pins for PN532 (HomeKey NFC)
    -DPNP532_SCK=4
    -DPN532_MISO=2
    -DPN532_MOSI=3
    -DPN532_SS=10
    -DPN532_IRQ=1
    ; Motor pins (DRV8833)
    -DMOTOR_AIN1=5
    -DMOTOR_AIN2=6
    -DMOTOR_BIN1=7
    -DMOTOR_BIN2=8
    ; I2C pins (LIS3DHTR)
    -DI2C_SDA=19
    -DI2C_SCL=20
    ; Motor PWM
    -DMOTOR_PWM_FREQ=20000
    -DMOTOR_PWM_RESOLUTION=8

; Library dependencies
lib_deps =
    ; HomeKey-ESP32 dependencies — check the repo for current list
    bblanchon/ArduinoJson
    knolleary/PubSubClient
    adafruit/Adafruit PN532
    sparkfun/SparkFun LIS3DH Arduino Library

; Upload port (change to match your system)
; upload_port = /dev/ttyACM0
; monitor_port = /dev/ttyACM0
